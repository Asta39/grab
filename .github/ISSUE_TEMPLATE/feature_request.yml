name: Feature request
description: An idea to make Grab better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us what you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working. Sketches and screenshots welcome.
  - type: dropdown
    id: platform
    attributes:
      label: Where
      multiple: true
      options: [Android, macOS, Windows, Website]
