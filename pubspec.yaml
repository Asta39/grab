name: grab
description: "Grab: download video, audio and subtitles from TikTok, YouTube, Instagram, Pinterest and 1,800+ sites."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  confetti: ^0.8.0
  device_info_plus: ^13.3.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.5.0
  liquid_glass_renderer: 0.2.0-dev.4
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  receive_sharing_intent: ^1.9.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  toastification: ^3.2.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
